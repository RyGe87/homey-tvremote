<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    /* The document itself must never scroll: everything that needs to move
       has its own scroll container. Otherwise a drag on the touchpad takes
       the whole widget along. */
    html, body { height: 100%; overflow: hidden; }

    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--homey-text-color, #14161c);
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100vh;
      user-select: none;
      /* Keep a gesture that starts here from bleeding into the dashboard. */
      overscroll-behavior: none;
    }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    button {
      font: inherit;
      font-size: 15px;
      color: inherit;
      border: none;
      border-radius: 12px;
      padding: 12px 6px;
      background: var(--homey-color-mono-100, rgba(127, 137, 160, 0.16));
      cursor: pointer;
      transition: transform 0.06s ease, background 0.15s ease;
    }
    button:active, button.flash {
      background: var(--homey-color-blue-500, #1f7aec);
      color: #fff;
      transform: scale(0.96);
    }
    button:disabled { opacity: 0.5; }

    .power { background: var(--homey-color-red-100, rgba(226, 74, 74, 0.16)); font-size: 18px; }
    .power.busy { animation: knock 1s ease-in-out infinite; }
    @keyframes knock { 50% { opacity: 0.45; } }
    .power.on { background: var(--homey-color-green-100, rgba(46, 173, 110, 0.2)); }


    /* Two screens side by side; swipe anywhere outside the touchpad. */
    .screens {
      flex: 1;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      overscroll-behavior: contain;
      gap: 10px;
      min-height: 0;
    }
    .screens::-webkit-scrollbar { display: none; }
    .screen {
      min-width: 100%;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .tabs { display: flex; gap: 6px; justify-content: center; }
    .tab {
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 999px;
      opacity: 0.45;
      background: var(--homey-color-mono-100, rgba(127, 137, 160, 0.16));
      cursor: pointer;
    }
    .tab.active { opacity: 1; background: var(--homey-color-blue-500, #1f7aec); color: #fff; }

    /* Touchpad */
    .pad {
      position: relative;
      flex: 1;
      min-height: 130px;
      border-radius: 18px;
      background: var(--homey-color-mono-050, rgba(127, 137, 160, 0.1));
      border: 1px solid var(--homey-color-mono-100, rgba(127, 137, 160, 0.18));
      display: grid;
      place-items: center;
      touch-action: none;
      overflow: hidden;
    }
    .pad .ok {
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      transition: background 0.12s ease;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.06em;
      opacity: 0.75;
      pointer-events: none;
    }
    .pad .hint {
      position: absolute;
      font-size: 17px;
      opacity: 0.45;
      pointer-events: none;
    }
    .hint.up { top: 8px; }
    .hint.down { bottom: 8px; }
    .hint.left { left: 12px; }
    .hint.right { right: 12px; }

    /* The diagonals carve the pad into four triangles. They are invisible
       until one is hit, so the pad shows exactly what it understood. */
    .zone {
      position: absolute;
      inset: 0;
      background: var(--homey-color-blue-500, #1f7aec);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    .zone.up { clip-path: polygon(0 0, 100% 0, 50% 50%); }
    .zone.right { clip-path: polygon(100% 0, 100% 100%, 50% 50%); }
    .zone.down { clip-path: polygon(100% 100%, 0 100%, 50% 50%); }
    .zone.left { clip-path: polygon(0 100%, 0 0, 50% 50%); }
    .zone.lit { opacity: 0.3; }

    .pad .ok.lit {
      background: var(--homey-color-blue-500, #1f7aec);
      color: #fff;
      opacity: 1;
    }

    input[type="search"] {
      font: inherit;
      font-size: 16px;
      color: inherit;
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--homey-color-mono-100, rgba(127, 137, 160, 0.25));
      background: var(--homey-color-mono-050, rgba(127, 137, 160, 0.1));
      -webkit-appearance: none;
    }

    .explain { font-size: 12px; opacity: 0.55; line-height: 1.45; margin: 2px 0; }

    /* Deliberately not a theme variable: on the dashboard that resolved to
       near-white, leaving the label unreadable until the button was held. */
    .primary { background: rgba(31, 122, 236, 0.22); font-weight: 600; }


    /* The search screen can outgrow the widget once pairing is shown. */
    .screen.scrolls { overflow-y: auto; }

    .status {
      font-size: 12px;
      text-align: center;
      opacity: 0.6;
      min-height: 15px;
    }
    .status.error { color: var(--homey-color-red-500, #e24a4a); opacity: 1; }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-screen="0">Bediening</div>
    <div class="tab" data-screen="1">Zoeken</div>
  </div>

  <div class="screens" id="screens">

    <section class="screen">
      <div class="row">
        <button class="power" id="power" title="Aan/uit">&#9211;</button>
        <button data-button="mute" title="Dempen">&#128263;</button>
        <button data-button="volume_down" title="Zachter">&#8722;</button>
        <button data-button="volume_up" title="Harder">&#43;</button>
      </div>

      <div class="pad" id="pad">
        <span class="zone up"></span>
        <span class="zone right"></span>
        <span class="zone down"></span>
        <span class="zone left"></span>
        <span class="hint up">&#9650;</span>
        <span class="hint down">&#9660;</span>
        <span class="hint left">&#9664;</span>
        <span class="hint right">&#9654;</span>
        <span class="ok">OK</span>
      </div>

      <div class="row">
        <button data-button="back">Terug</button>
        <button data-button="exit">Exit</button>
        <button data-button="info">&#8505;</button>
      </div>

      <div class="row">
        <button data-button="previous">&#9198; Vorig filmpje</button>
        <button data-button="next">Volgend filmpje &#9197;</button>
      </div>
    </section>

    <section class="screen scrolls">
      <input type="search" id="term" placeholder="Zoekterm typen&hellip;"
             autocomplete="off" autocorrect="off" spellcheck="false"
             enterkeyhint="search">
      <div class="row">
        <button data-search="youtube">YouTube</button>
        <button data-search="netflix">Netflix</button>
      </div>
      <div class="row">
        <button id="sendtext" class="primary">&#9998; Stuur naar het veld op de tv</button>
      </div>


      <p class="explain">
        De bovenste twee knoppen openen zoekresultaten rechtstreeks. Staat er een
        zoekveld open op de tv, dan zet de knop daaronder je hele term er in
        één keer in. Koppelen doe je bij het toevoegen van het apparaat.
      </p>
    </section>

  </div>

  <div class="status" id="status"></div>

  <script>
    // A swipe must travel this far before it counts as one cursor step, and
    // steps cannot follow each other faster than this. Both together keep a
    // list from shooting to the bottom on one flick of the thumb.
    const STEP = 58;
    const MIN_INTERVAL_MS = 220;

    let homey = null;
    let statusTimer = null;
    const statusEl = document.getElementById('status');

    function say(message, isError) {
      statusEl.textContent = message || '';
      statusEl.classList.toggle('error', Boolean(isError));
    }

    async function press(button) {
      try {
        const result = await homey.api('POST', '/press', { button });
        // The power button wakes a television that is past hearing keys.
        if (result && result.waking) {
          say('Tv niet bereikbaar — wekken…');
          followWake();
          return;
        }
        if (result && typeof result.on === 'boolean') markPower(result.on);
        say('');
      } catch (err) {
        say(err && err.message ? err.message : 'Kon de opdracht niet versturen', true);
      }
    }

    function markPower(on) {
      document.getElementById('power').classList.toggle('on', Boolean(on));
    }

    function flash(el) {
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 120);
    }

    function wireButtons() {
      document.querySelectorAll('[data-button]').forEach(el => {
        el.addEventListener('click', () => {
          flash(el);
          press(el.dataset.button);
        });
      });
      document.getElementById('power').addEventListener('click', () => press('power'));
    }

    /** Touchpad: a short tap confirms, dragging steps through the menu. */
    function wirePad() {
      const pad = document.getElementById('pad');
      let originX = 0;
      let originY = 0;
      let lastStep = 0;
      let moved = false;
      let okRadius = 40;

      const flashZone = name => {
        const zone = pad.querySelector(name === 'ok' ? '.ok' : `.zone.${name}`);
        if (!zone) return;
        zone.classList.add('lit');
        setTimeout(() => zone.classList.remove('lit'), 130);
      };

      // touch-action alone does not stop the dashboard from scrolling under
      // the finger, so swallow the gesture outright. Without this, dragging
      // on the pad drags the whole page and a sideways swipe flips the tab.
      pad.addEventListener('touchstart', event => event.preventDefault(), { passive: false });
      pad.addEventListener('touchmove', event => event.preventDefault(), { passive: false });

      pad.addEventListener('pointerdown', event => {
        pad.setPointerCapture(event.pointerId);
        originX = event.clientX;
        originY = event.clientY;
        lastStep = 0;
        moved = false;
      });

      pad.addEventListener('pointermove', event => {
        const dx = event.clientX - originX;
        const dy = event.clientY - originY;
        if (Math.abs(dx) < STEP && Math.abs(dy) < STEP) return;
        if (Date.now() - lastStep < MIN_INTERVAL_MS) return;

        const direction = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? 'right' : 'left')
          : (dy > 0 ? 'down' : 'up');
        press(direction);
        // Reset both axes so a diagonal drag cannot bank up a second step.
        originX = event.clientX;
        originY = event.clientY;
        lastStep = Date.now();
        moved = true;
        flashZone(direction);
      });

      // A tap is read by where it landed: the circle in the middle confirms,
      // everything outside steps in the direction it points. The arrows are
      // labels for those zones, not decoration.
      pad.addEventListener('pointerup', event => {
        if (moved) return;

        const rect = pad.getBoundingClientRect();
        const dx = event.clientX - (rect.left + rect.width / 2);
        const dy = event.clientY - (rect.top + rect.height / 2);

        const hit = Math.hypot(dx, dy) <= okRadius
          ? 'ok'
          : (Math.abs(dx) > Math.abs(dy)
            ? (dx > 0 ? 'right' : 'left')
            : (dy > 0 ? 'down' : 'up'));

        press(hit === 'ok' ? 'ok' : hit);
        flashZone(hit);
      });

      // The visible circle IS the tap zone, so it is measured, never guessed.
      const okEl = pad.querySelector('.ok');
      const zones = [...pad.querySelectorAll('.zone')];
      const sizeOk = () => {
        const rect = pad.getBoundingClientRect();
        okRadius = Math.max(34, Math.min(rect.width, rect.height) * 0.26);
        okEl.style.width = `${okRadius * 2}px`;
        okEl.style.height = `${okRadius * 2}px`;

        // Punch the circle out of the triangles, using the very radius just
        // measured. Their tips would otherwise shine through the ring, which
        // lights up the middle while the middle was not what was pressed.
        const hole = `radial-gradient(circle at center, transparent 0 ${okRadius + 1}px, #000 ${okRadius + 1}px)`;
        zones.forEach(zone => {
          zone.style.webkitMaskImage = hole;
          zone.style.maskImage = hole;
        });
      };
      sizeOk();
      window.addEventListener('resize', sizeOk);
    }

    /** Tabs and swiping are two ways to the same two screens. */
    function wireScreens() {
      const screens = document.getElementById('screens');
      const tabs = [...document.querySelectorAll('.tab')];

      tabs.forEach(tab => tab.addEventListener('click', () => {
        screens.scrollTo({ left: screens.clientWidth * Number(tab.dataset.screen), behavior: 'smooth' });
      }));

      screens.addEventListener('scroll', () => {
        const index = Math.round(screens.scrollLeft / Math.max(screens.clientWidth, 1));
        tabs.forEach((tab, i) => tab.classList.toggle('active', i === index));
      }, { passive: true });
    }

    function wireSearch() {
      const term = document.getElementById('term');

      const go = async service => {
        if (!term.value.trim()) {
          say('Typ eerst een zoekterm', true);
          return;
        }
        say('Zoeken op de tv…');
        try {
          await homey.api('POST', '/search', { service, term: term.value });
          say('Gestuurd naar de tv');
          term.blur();
        } catch (err) {
          say(err && err.message ? err.message : 'Zoeken lukte niet', true);
        }
      };

      document.querySelectorAll('[data-search]').forEach(el => {
        el.addEventListener('click', () => {
          flash(el);
          go(el.dataset.search);
        });
      });

      term.addEventListener('keydown', event => {
        if (event.key === 'Enter') go('youtube');
      });

    }

    /** Real text input needs its own pairing, so the offer only appears
     *  while that has not happened yet. */

    function wireText() {
      const term = document.getElementById('term');
      const button = document.getElementById('sendtext');

      button.addEventListener('click', async () => {
        if (!term.value.trim()) {
          say('Typ eerst een zoekterm', true);
          return;
        }
        flash(button);
        button.disabled = true;
        say('Versturen…');
        try {
          const result = await homey.api('POST', '/text', { term: term.value });
          if (result && result.ok) say(`In het veld staat nu: ${result.field}`);
          else say((result && result.hint) || 'De tv nam de tekst niet aan', true);
        } catch (err) {
          say(err && err.message ? err.message : 'Versturen lukte niet', true);
        }
        button.disabled = false;
      });
    }




    /** Waking runs in the app and can take a minute and a half, so the power
     *  button starts it and the status line follows along. */
    function followWake() {
      const power = document.getElementById('power');
      power.classList.add('busy');
      clearInterval(statusTimer);

      statusTimer = setInterval(async () => {
        try {
          const result = await homey.api('GET', '/status', {});
          if (result && result.waking) {
            say('Wekken… de tv reageert nog niet');
            return;
          }
          clearInterval(statusTimer);
          power.classList.remove('busy');
          markPower(Boolean(result && result.on));

          if (result && result.wakeResult && result.wakeResult.ok) say('De tv is wakker');
          else if (result && result.wakeResult) say(result.wakeResult.error || 'De tv reageerde niet', true);
        } catch (err) {
          // Keep polling; a hiccup while the television boots is expected.
        }
      }, 3000);
    }

    function onHomeyReady(Homey) {
      homey = Homey;
      wireButtons();
      wirePad();
      wireScreens();
      wireSearch();
      wireText();
      Homey.ready();

      Homey.api('GET', '/status', {})
        .then(result => {
          if (!result || !result.found) {
            say('Geen Android TV-apparaat gevonden', true);
            return;
          }
          markPower(result.on);
          if (result.waking) followWake();
          else if (!result.paired) say('Nog niet gekoppeld: voeg de tv toe als apparaat', true);
          else if (!result.available) say('De tv is niet bereikbaar (slaapt hij?)');
        })
        .catch(() => say('Kon de status niet ophalen', true));
    }
  </script>
</body>
</html>
